basePath: /
definitions:
  dto.AddCompanyMemberRequest:
    properties:
      email:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - invited
        type: string
      user_id:
        type: string
    type: object
  dto.AddSubscriptionAddonRequest:
    properties:
      addon_id:
        type: string
      quantity:
        description: Quantity — default 1.
        maximum: 1000000
        minimum: 1
        type: integer
    required:
    - addon_id
    type: object
  dto.AddonResponse:
    properties:
      billing_cycle:
        type: string
      code:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        example: "25000.00"
        type: string
      solution_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.AssignedBenefitResponse:
    properties:
      aggregation_strategy:
        type: string
      benefit_id:
        type: string
      code:
        type: string
      metering:
        type: string
      name:
        type: string
      unit:
        type: string
      value:
        type: object
      value_type:
        type: string
    type: object
  dto.AuthTokenResponse:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      company_id:
        description: CompanyID company aktif; null bila user belum memilih company
          (diisi mulai Fase 10).
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      token_type:
        type: string
    type: object
  dto.AuthzCheckBatchRequest:
    properties:
      checks:
        items:
          $ref: '#/definitions/dto.AuthzCheckItem'
        maxItems: 100
        minItems: 1
        type: array
      company_id:
        type: string
      user_id:
        type: string
    required:
    - checks
    type: object
  dto.AuthzCheckBatchResponse:
    properties:
      company_id:
        type: string
      results:
        items:
          $ref: '#/definitions/dto.AuthzCheckResult'
        type: array
      user_id:
        type: string
    type: object
  dto.AuthzCheckItem:
    properties:
      permission:
        maxLength: 150
        type: string
      scope_id:
        type: string
      scope_type:
        enum:
        - company
        - branch
        type: string
    required:
    - permission
    type: object
  dto.AuthzCheckRequest:
    properties:
      company_id:
        type: string
      permission:
        maxLength: 150
        type: string
      scope_id:
        type: string
      scope_type:
        enum:
        - company
        - branch
        type: string
      user_id:
        type: string
    required:
    - permission
    type: object
  dto.AuthzCheckResult:
    properties:
      allowed:
        type: boolean
      granted_by:
        description: GrantedBy — code role yang memberi izin.
        items:
          type: string
        type: array
      permission:
        type: string
      scope_id:
        type: string
      scope_type:
        type: string
    type: object
  dto.BenefitResponse:
    properties:
      aggregation_strategy:
        type: string
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      metering:
        type: string
      name:
        type: string
      solution_id:
        type: string
      unit:
        type: string
      updated_at:
        type: string
      usage_reset:
        type: string
      value_type:
        type: string
    type: object
  dto.BenefitValueInput:
    properties:
      benefit_id:
        type: string
      value:
        type: object
    required:
    - benefit_id
    - value
    type: object
  dto.BranchResponse:
    properties:
      code:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.ChangePlanRequest:
    properties:
      plan_id:
        type: string
    required:
    - plan_id
    type: object
  dto.CompanyMemberResponse:
    properties:
      company_id:
        type: string
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  dto.CompanyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateAddonRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - yearly
        type: string
      code:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      price:
        description: Price — angka JSON atau string angka, maks 2 desimal (mis. 25000
          atau "25000.00").
        example: "25000.00"
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateBenefitRequest:
    properties:
      aggregation_strategy:
        enum:
        - sum
        - max
        - min
        - override
        - any_true
        type: string
      code:
        maxLength: 100
        type: string
      description:
        type: string
      metering:
        enum:
        - none
        - counter
        - gauge
        type: string
      name:
        maxLength: 255
        type: string
      unit:
        maxLength: 50
        type: string
      usage_reset:
        enum:
        - never
        - billing_period
        - monthly
        type: string
      value_type:
        enum:
        - boolean
        - integer
        - decimal
        - string
        - json
        type: string
    required:
    - aggregation_strategy
    - code
    - name
    - value_type
    type: object
  dto.CreateCompanyRequest:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateOrgUnitRequest:
    properties:
      code:
        maxLength: 100
        type: string
      name:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - code
    - name
    type: object
  dto.CreatePlanRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - yearly
        type: string
      code:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      price:
        description: Price — angka JSON atau string angka, maks 2 desimal (mis. 150000
          atau "150000.50").
        example: "150000.00"
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateRoleAssignmentRequest:
    properties:
      role_id:
        type: string
      scope_id:
        description: ScopeID — wajib untuk company / branch; untuk company boleh kosong
          (= company itu sendiri).
        type: string
      scope_type:
        description: ScopeType — company (default) | branch.
        enum:
        - company
        - branch
        type: string
    required:
    - role_id
    type: object
  dto.CreateRoleRequest:
    properties:
      code:
        maxLength: 100
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateSolutionClientRequest:
    properties:
      name:
        maxLength: 255
        type: string
      scopes:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  dto.CreateSolutionRequest:
    properties:
      code:
        maxLength: 100
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateSubscriptionRequest:
    properties:
      current_period_start:
        description: CurrentPeriodStart — default sekarang. current_period_end dihitung
          dari billing_cycle plan.
        type: string
      plan_id:
        type: string
      status:
        description: 'Status awal: active (default) atau trialing.'
        enum:
        - active
        - trialing
        type: string
    required:
    - plan_id
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      is_platform_admin:
        type: boolean
      name:
        maxLength: 255
        type: string
      password:
        description: 'Password opsional: user tanpa password belum bisa login (mis.
          menunggu undangan).'
        maxLength: 72
        minLength: 8
        type: string
      status:
        enum:
        - active
        - inactive
        - suspended
        type: string
    required:
    - email
    - name
    type: object
  dto.CreateWebhookRequest:
    properties:
      event_types:
        description: EventTypes — subset katalog event (spec §2.9).
        items:
          type: string
        maxItems: 50
        minItems: 1
        type: array
      url:
        example: https://hr.example.com/hooks/platform
        maxLength: 2048
        type: string
    required:
    - event_types
    - url
    type: object
  dto.CursorMeta:
    properties:
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  dto.EntitlementResponse:
    properties:
      aggregation_strategy:
        type: string
      benefit_code:
        type: string
      granted:
        description: Granted — benefit diberikan plan / add-on aktif.
        type: boolean
      limit:
        description: Limit / Used / Remaining hanya untuk benefit angka yang di-meter
          (counter / gauge).
        type: string
      limit_reached:
        type: boolean
      metering:
        type: string
      name:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      remaining:
        type: string
      unit:
        type: string
      unlimited:
        type: boolean
      used:
        type: string
      value:
        description: Value — nilai efektif; -1 = unlimited; null bila tidak granted.
        type: object
      value_type:
        type: string
    type: object
  dto.EntitlementSubscription:
    properties:
      current_period_end:
        type: string
      id:
        type: string
      plan_id:
        type: string
      status:
        type: string
    type: object
  dto.EntitlementsResponse:
    properties:
      company_id:
        type: string
      entitlements:
        items:
          $ref: '#/definitions/dto.EntitlementResponse'
        type: array
      solution_id:
        type: string
      subscription:
        allOf:
        - $ref: '#/definitions/dto.EntitlementSubscription'
        description: Subscription — null bila company tidak berlangganan (semua benefit
          granted=false).
    type: object
  dto.EventItem:
    properties:
      company_id:
        type: string
      data:
        type: object
      id:
        type: string
      occurred_at:
        type: string
      solution_id:
        type: string
      type:
        type: string
    type: object
  dto.HealthResponse:
    properties:
      database:
        type: string
      deployment_mode:
        type: string
      status:
        type: string
    type: object
  dto.JWK:
    properties:
      alg:
        type: string
      e:
        type: string
      kid:
        type: string
      kty:
        type: string
      "n":
        type: string
      use:
        type: string
    type: object
  dto.JWKSResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/dto.JWK'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        type: string
      solution:
        description: Solution adalah solutions.code tujuan login (menjadi aud token).
        maxLength: 100
        type: string
    required:
    - email
    - password
    - solution
    type: object
  dto.MeResponse:
    properties:
      session:
        $ref: '#/definitions/dto.SessionResponse'
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.Meta:
    properties:
      current_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.OAuthError:
    properties:
      error:
        type: string
      error_description:
        type: string
    type: object
  dto.OAuthTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      scope:
        type: string
      token_type:
        type: string
    type: object
  dto.PermissionDefinition:
    properties:
      code:
        maxLength: 150
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
    required:
    - code
    - name
    type: object
  dto.PermissionResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.PlanResponse:
    properties:
      billing_cycle:
        type: string
      code:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        example: "150000.00"
        type: string
      solution_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        maxLength: 200
        type: string
    required:
    - refresh_token
    type: object
  dto.ReplaceBenefitsRequest:
    properties:
      benefits:
        items:
          $ref: '#/definitions/dto.BenefitValueInput'
        type: array
    required:
    - benefits
    type: object
  dto.ReplaceRolePermissionsRequest:
    properties:
      permission_codes:
        items:
          type: string
        type: array
    required:
    - permission_codes
    type: object
  dto.ReportUsageAbsoluteRequest:
    properties:
      idempotency_key:
        maxLength: 150
        type: string
      occurred_at:
        type: string
      quantity:
        description: Quantity — nilai absolut terkini (angka atau string angka ≥ 0,
          maks 4 desimal).
        example: "120"
        type: string
    required:
    - idempotency_key
    - quantity
    type: object
  dto.ReportUsageDeltaRequest:
    properties:
      benefit_code:
        maxLength: 100
        type: string
      idempotency_key:
        maxLength: 150
        type: string
      occurred_at:
        description: OccurredAt — default waktu server.
        type: string
      quantity:
        description: Quantity — angka atau string angka > 0, maks 4 desimal.
        example: "1"
        type: string
    required:
    - benefit_code
    - idempotency_key
    - quantity
    type: object
  dto.RoleAssignmentResponse:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      role_code:
        type: string
      role_id:
        type: string
      scope_id:
        type: string
      scope_type:
        type: string
      solution_id:
        type: string
      user_id:
        type: string
    type: object
  dto.RolePermissionResponse:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  dto.RoleResponse:
    properties:
      code:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      name:
        type: string
      scope:
        description: Scope — "system" | "global" | "company".
        type: string
      solution_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.SelectableCompanyResponse:
    properties:
      id:
        type: string
      is_active:
        description: IsActive — company ini adalah company aktif token saat ini.
        type: boolean
      name:
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
  dto.SessionResponse:
    properties:
      company_id:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      solution:
        $ref: '#/definitions/dto.SolutionSummary'
    type: object
  dto.SolutionClientResponse:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      revoked_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionClientWithSecretResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      revoked_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permission_catalog_version:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionSummary:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.SubscriptionAddonResponse:
    properties:
      addon_code:
        type: string
      addon_id:
        type: string
      addon_name:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      quantity:
        type: integer
      status:
        type: string
      subscription_id:
        type: string
      unit_price_at_purchase:
        example: "25000.00"
        type: string
      updated_at:
        type: string
    type: object
  dto.SubscriptionResponse:
    properties:
      billing_cycle:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      current_period_end:
        type: string
      current_period_start:
        type: string
      id:
        type: string
      plan_code:
        type: string
      plan_id:
        type: string
      plan_name:
        type: string
      price_at_purchase:
        example: "150000.00"
        type: string
      solution_code:
        type: string
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SwitchCompanyRequest:
    properties:
      company_id:
        type: string
    required:
    - company_id
    type: object
  dto.SyncPermissionsRequest:
    properties:
      permissions:
        items:
          $ref: '#/definitions/dto.PermissionDefinition'
        type: array
      version:
        description: Version — versi katalog; sama dengan versi tersimpan → tidak
          ada perubahan.
        maxLength: 50
        type: string
    required:
    - permissions
    - version
    type: object
  dto.SyncPermissionsResponse:
    properties:
      changed:
        description: Changed — false bila versi sama dengan versi tersimpan (sync
          dilewati).
        type: boolean
      created:
        type: integer
      deprecated:
        type: integer
      reactivated:
        type: integer
      unchanged:
        type: integer
      updated:
        type: integer
      version:
        type: string
    type: object
  dto.UpdateCompanyMemberRequest:
    properties:
      status:
        enum:
        - invited
        - active
        - inactive
        type: string
    required:
    - status
    type: object
  dto.UpdateCompanyRequest:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
      status:
        enum:
        - active
        - suspended
        - closed
        type: string
    type: object
  dto.UpdateSolutionClientRequest:
    properties:
      name:
        maxLength: 255
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  dto.UsageReportResponse:
    properties:
      benefit_code:
        type: string
      limit:
        description: Limit / Remaining — dari entitlement efektif; null bila unlimited
          / tidak granted.
        type: string
      limit_reached:
        type: boolean
      mode:
        type: string
      occurred_at:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      remaining:
        type: string
      replayed:
        description: Replayed — true bila idempotency_key sudah pernah diterima (tidak
          diterapkan ulang).
        type: boolean
      used:
        description: Used — pemakaian terkini pada periode tersebut (string presisi
          4 desimal).
        example: "15.0000"
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      is_platform_admin:
        type: boolean
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.WebhookWithSecretResponse:
    properties:
      created_at:
        type: string
      event_types:
        items:
          type: string
        type: array
      id:
        type: string
      secret:
        description: Secret — kunci HMAC-SHA256 untuk memverifikasi X-Platform-Signature.
        type: string
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  respond.ErrorBody:
    properties:
      error_code:
        type: string
      errors: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
  respond.SuccessBody:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
info:
  contact: {}
  description: Identity, company, catalog, subscription, entitlement, authorization,
    dan licensing untuk solution.
  title: Central SaaS Platform API
  version: "1.0"
paths:
  /api/v1/.well-known/jwks.json:
    get:
