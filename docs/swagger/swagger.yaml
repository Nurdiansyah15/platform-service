basePath: /
definitions:
  dto.CreateSolutionRequest:
    properties:
      code:
        maxLength: 100
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - code
    - name
    type: object
  dto.HealthResponse:
    properties:
      database:
        type: string
      deployment_mode:
        type: string
      status:
        type: string
    type: object
  dto.Meta:
    properties:
      current_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.SolutionResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permission_catalog_version:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  respond.ErrorBody:
    properties:
      error_code:
        type: string
      errors: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
  respond.SuccessBody:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
info:
  contact: {}
  description: Identity, tenant, catalog, subscription, entitlement, authorization,
    dan licensing untuk solution.
  title: Central SaaS Platform API
  version: "1.0"
paths:
  /api/v1/solutions:
    get:
      parameters:
      - description: active | inactive (platform admin saja)
        in: query
        name: status
        type: string
      - description: Cari di code / name
        in: query
        name: search
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (maks 100)
        in: query
        name: limit
        type: integer
      - description: code | name | created_at
        in: query
        name: sort_by
        type: string
      - description: asc | desc
        in: query
        name: sort_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SolutionResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: List solutions
      tags:
      - Solution Catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Solution
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSolutionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.SolutionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create solution
      tags:
      - Solution Catalog
  /api/v1/solutions/{solutionId}:
    get:
      parameters:
      - description: Solution ID
        in: path
        name: solutionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.SolutionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get solution
      tags:
      - Solution Catalog
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.HealthResponse'
              type: object
        "503":
          description: Service Unavailable
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.HealthResponse'
              type: object
      summary: Health check
      tags:
      - System
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
