basePath: /
definitions:
  dto.AddSubscriptionAddonRequest:
    properties:
      addon_id:
        type: string
      quantity:
        description: Quantity — default 1.
        maximum: 1000000
        minimum: 1
        type: integer
    required:
    - addon_id
    type: object
  dto.AddTenantMemberRequest:
    properties:
      email:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - invited
        type: string
      user_id:
        type: string
    type: object
  dto.AddonResponse:
    properties:
      billing_cycle:
        type: string
      code:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        example: "25000.00"
        type: string
      solution_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.AssignedBenefitResponse:
    properties:
      aggregation_strategy:
        type: string
      benefit_id:
        type: string
      code:
        type: string
      metering:
        type: string
      name:
        type: string
      unit:
        type: string
      value:
        type: object
      value_type:
        type: string
    type: object
  dto.AuthTokenResponse:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      tenant_id:
        description: TenantID tenant aktif; null bila user belum memilih tenant (diisi
          mulai Fase 10).
        type: string
      token_type:
        type: string
    type: object
  dto.BenefitResponse:
    properties:
      aggregation_strategy:
        type: string
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      metering:
        type: string
      name:
        type: string
      solution_id:
        type: string
      unit:
        type: string
      updated_at:
        type: string
      usage_reset:
        type: string
      value_type:
        type: string
    type: object
  dto.BenefitValueInput:
    properties:
      benefit_id:
        type: string
      value:
        type: object
    required:
    - benefit_id
    - value
    type: object
  dto.BranchResponse:
    properties:
      code:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.ChangePlanRequest:
    properties:
      plan_id:
        type: string
    required:
    - plan_id
    type: object
  dto.CompanyResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateAddonRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - yearly
        type: string
      code:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      price:
        description: Price — angka JSON atau string angka, maks 2 desimal (mis. 25000
          atau "25000.00").
        example: "25000.00"
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateBenefitRequest:
    properties:
      aggregation_strategy:
        enum:
        - sum
        - max
        - min
        - override
        - any_true
        type: string
      code:
        maxLength: 100
        type: string
      description:
        type: string
      metering:
        enum:
        - none
        - counter
        - gauge
        type: string
      name:
        maxLength: 255
        type: string
      unit:
        maxLength: 50
        type: string
      usage_reset:
        enum:
        - never
        - billing_period
        - monthly
        type: string
      value_type:
        enum:
        - boolean
        - integer
        - decimal
        - string
        - json
        type: string
    required:
    - aggregation_strategy
    - code
    - name
    - value_type
    type: object
  dto.CreateOrgUnitRequest:
    properties:
      code:
        maxLength: 100
        type: string
      name:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - code
    - name
    type: object
  dto.CreatePlanRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - yearly
        type: string
      code:
        maxLength: 100
        type: string
      currency:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      price:
        description: Price — angka JSON atau string angka, maks 2 desimal (mis. 150000
          atau "150000.50").
        example: "150000.00"
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateSolutionClientRequest:
    properties:
      name:
        maxLength: 255
        type: string
      scopes:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  dto.CreateSolutionRequest:
    properties:
      code:
        maxLength: 100
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateSubscriptionRequest:
    properties:
      current_period_start:
        description: CurrentPeriodStart — default sekarang. current_period_end dihitung
          dari billing_cycle plan.
        type: string
      plan_id:
        type: string
      status:
        description: 'Status awal: active (default) atau trialing.'
        enum:
        - active
        - trialing
        type: string
    required:
    - plan_id
    type: object
  dto.CreateTenantRequest:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      is_platform_admin:
        type: boolean
      name:
        maxLength: 255
        type: string
      password:
        description: 'Password opsional: user tanpa password belum bisa login (mis.
          menunggu undangan).'
        maxLength: 72
        minLength: 8
        type: string
      status:
        enum:
        - active
        - inactive
        - suspended
        type: string
    required:
    - email
    - name
    type: object
  dto.HealthResponse:
    properties:
      database:
        type: string
      deployment_mode:
        type: string
      status:
        type: string
    type: object
  dto.JWK:
    properties:
      alg:
        type: string
      e:
        type: string
      kid:
        type: string
      kty:
        type: string
      "n":
        type: string
      use:
        type: string
    type: object
  dto.JWKSResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/dto.JWK'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        type: string
      solution:
        description: Solution adalah solutions.code tujuan login (menjadi aud token).
        maxLength: 100
        type: string
    required:
    - email
    - password
    - solution
    type: object
  dto.MeResponse:
    properties:
      session:
        $ref: '#/definitions/dto.SessionResponse'
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.Meta:
    properties:
      current_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.OAuthError:
    properties:
      error:
        type: string
      error_description:
        type: string
    type: object
  dto.OAuthTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      scope:
        type: string
      token_type:
        type: string
    type: object
  dto.PlanResponse:
    properties:
      billing_cycle:
        type: string
      code:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        example: "150000.00"
        type: string
      solution_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        maxLength: 200
        type: string
    required:
    - refresh_token
    type: object
  dto.ReplaceBenefitsRequest:
    properties:
      benefits:
        items:
          $ref: '#/definitions/dto.BenefitValueInput'
        type: array
    required:
    - benefits
    type: object
  dto.SelectableTenantResponse:
    properties:
      id:
        type: string
      is_active:
        description: IsActive — tenant ini adalah tenant aktif token saat ini.
        type: boolean
      name:
        type: string
      slug:
        type: string
      status:
        type: string
    type: object
  dto.SessionResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      solution:
        $ref: '#/definitions/dto.SolutionSummary'
      tenant_id:
        type: string
    type: object
  dto.SolutionClientWithSecretResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      revoked_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permission_catalog_version:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionSummary:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.SubscriptionAddonResponse:
    properties:
      addon_code:
        type: string
      addon_id:
        type: string
      addon_name:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      quantity:
        type: integer
      status:
        type: string
      subscription_id:
        type: string
      unit_price_at_purchase:
        example: "25000.00"
        type: string
      updated_at:
        type: string
    type: object
  dto.SubscriptionResponse:
    properties:
      billing_cycle:
        type: string
      created_at:
        type: string
      currency:
        type: string
      current_period_end:
        type: string
      current_period_start:
        type: string
      id:
        type: string
      plan_code:
        type: string
      plan_id:
        type: string
      plan_name:
        type: string
      price_at_purchase:
        example: "150000.00"
        type: string
      solution_code:
        type: string
      solution_id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.SwitchTenantRequest:
    properties:
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  dto.TenantMemberResponse:
    properties:
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      user_id:
        type: string
    type: object
  dto.TenantResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      is_platform_admin:
        type: boolean
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  respond.ErrorBody:
    properties:
      error_code:
        type: string
      errors: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
  respond.SuccessBody:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
info:
  contact: {}
  description: Identity, tenant, catalog, subscription, entitlement, authorization,
    dan licensing untuk solution.
  title: Central SaaS Platform API
  version: "1.0"
paths:
  /api/v1/.well-known/jwks.json:
    get:
      description: Public key untuk memverifikasi token platform (key active & retiring).
        Respons tanpa envelope (RFC 7517).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JWKSResponse'
      summary: JSON Web Key Set
      tags:
      - Service Auth
  /api/v1/addons/{addonId}/benefits:
    get:
      parameters:
      - description: Add-on ID
        in: path
        name: addonId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AssignedBenefitResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: List add-on benefits
      tags:
      - Add-ons
    put:
      consumes:
      - application/json
      description: 'Replace-all: daftar ini menjadi seluruh benefit add-on (array
        kosong = hapus semua). Tidak memengaruhi subscription berjalan.'
      parameters:
      - description: Add-on ID
        in: path
        name: addonId
        required: true
        type: string
      - description: Benefit values
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReplaceBenefitsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AssignedBenefitResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Replace add-on benefits
      tags:
      - Add-ons
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial + code solution tujuan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.SuccessBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Logout (revoke sesi saat ini)
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: User & sesi saat ini
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      summary: Refresh token
      tags:
      - Auth
  /api/v1/auth/switch-tenant:
    post:
      consumes:
      - application/json
      description: Mengganti tenant aktif sesi dan menerbitkan access & refresh token
        baru; refresh token lama tidak berlaku.
      parameters:
      - description: Tenant tujuan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SwitchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Switch active tenant
      tags:
      - Auth
  /api/v1/auth/tenants:
    get:
      description: Tenant tempat user member active, tenant active, dan subscribe
        solution sesi (trialing / active).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SelectableTenantResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Tenants selectable for the session's solution
      tags:
      - Auth
  /api/v1/benefits/{benefitId}:
    get:
      parameters:
      - description: Benefit ID
        in: path
        name: benefitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.BenefitResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get benefit
      tags:
      - Benefits
  /api/v1/companies/{companyId}/branches:
    get:
      parameters:
      - description: Company ID
        in: path
        name: companyId
        required: true
        type: string
      - description: active | inactive
        in: query
        name: status
        type: string
      - description: Cari di code / name
        in: query
        name: search
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (maks 100)
        in: query
        name: limit
        type: integer
      - description: code | name | created_at
        in: query
        name: sort_by
        type: string
      - description: asc | desc
        in: query
        name: sort_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.BranchResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: List branches
      tags:
      - Organization
    post:
      consumes:
      - application/json
      description: code dinormalisasi UPPERCASE, unik per company. Company tenant
        lain → 404.
      parameters:
      - description: Company ID
        in: path
