basePath: /
definitions:
  dto.AddTenantMemberRequest:
    properties:
      email:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - invited
        type: string
      user_id:
        type: string
    type: object
  dto.AuthTokenResponse:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      tenant_id:
        description: TenantID tenant aktif; null bila user belum memilih tenant (diisi
          mulai Fase 10).
        type: string
      token_type:
        type: string
    type: object
  dto.CreateSolutionClientRequest:
    properties:
      name:
        maxLength: 255
        type: string
      scopes:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  dto.CreateSolutionRequest:
    properties:
      code:
        maxLength: 100
        type: string
      description:
        type: string
      name:
        maxLength: 255
        type: string
      status:
        enum:
        - active
        - inactive
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateTenantRequest:
    properties:
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
    required:
    - name
    - slug
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      is_platform_admin:
        type: boolean
      name:
        maxLength: 255
        type: string
      password:
        description: 'Password opsional: user tanpa password belum bisa login (mis.
          menunggu undangan).'
        maxLength: 72
        minLength: 8
        type: string
      status:
        enum:
        - active
        - inactive
        - suspended
        type: string
    required:
    - email
    - name
    type: object
  dto.HealthResponse:
    properties:
      database:
        type: string
      deployment_mode:
        type: string
      status:
        type: string
    type: object
  dto.JWK:
    properties:
      alg:
        type: string
      e:
        type: string
      kid:
        type: string
      kty:
        type: string
      "n":
        type: string
      use:
        type: string
    type: object
  dto.JWKSResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/dto.JWK'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        type: string
      solution:
        description: Solution adalah solutions.code tujuan login (menjadi aud token).
        maxLength: 100
        type: string
    required:
    - email
    - password
    - solution
    type: object
  dto.MeResponse:
    properties:
      session:
        $ref: '#/definitions/dto.SessionResponse'
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.Meta:
    properties:
      current_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.OAuthError:
    properties:
      error:
        type: string
      error_description:
        type: string
    type: object
  dto.OAuthTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      scope:
        type: string
      token_type:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        maxLength: 200
        type: string
    required:
    - refresh_token
    type: object
  dto.SessionResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      solution:
        $ref: '#/definitions/dto.SolutionSummary'
      tenant_id:
        type: string
    type: object
  dto.SolutionClientWithSecretResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      revoked_at:
        type: string
      scopes:
        items:
          type: string
        type: array
      solution_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permission_catalog_version:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.SolutionSummary:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.TenantMemberResponse:
    properties:
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      user_id:
        type: string
    type: object
  dto.TenantResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      is_platform_admin:
        type: boolean
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  respond.ErrorBody:
    properties:
      error_code:
        type: string
      errors: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
  respond.SuccessBody:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        type: string
      status_code:
        type: integer
    type: object
info:
  contact: {}
  description: Identity, tenant, catalog, subscription, entitlement, authorization,
    dan licensing untuk solution.
  title: Central SaaS Platform API
  version: "1.0"
paths:
  /api/v1/.well-known/jwks.json:
    get:
      description: Public key untuk memverifikasi token platform (key active & retiring).
        Respons tanpa envelope (RFC 7517).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JWKSResponse'
      summary: JSON Web Key Set
      tags:
      - Service Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial + code solution tujuan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.SuccessBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Logout (revoke sesi saat ini)
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.MeResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: User & sesi saat ini
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthTokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      summary: Refresh token
      tags:
      - Auth
  /api/v1/oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: RFC 6749 §4.4. Kredensial via HTTP Basic atau field body. Respons
        & error format OAuth2 standar (tanpa envelope).
      parameters:
      - description: client_credentials
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Client ID (bila tidak memakai Basic)
        in: formData
        name: client_id
        type: string
      - description: Client secret (bila tidak memakai Basic)
        in: formData
        name: client_secret
        type: string
      - description: Subset scope, dipisah spasi
        in: formData
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OAuthTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.OAuthError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.OAuthError'
      summary: OAuth2 token (client credentials)
      tags:
      - Service Auth
  /api/v1/solution-clients/{clientId}/rotate-secret:
    post:
      description: Secret lama langsung tidak berlaku; secret baru hanya ditampilkan
        sekali.
      parameters:
      - description: Solution client ID (UUID)
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.SolutionClientWithSecretResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Rotate client secret
      tags:
      - Solution Clients
  /api/v1/solutions:
    get:
      parameters:
      - description: active | inactive (platform admin saja)
        in: query
        name: status
        type: string
      - description: Cari di code / name
        in: query
        name: search
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (maks 100)
        in: query
        name: limit
        type: integer
      - description: code | name | created_at
        in: query
        name: sort_by
        type: string
      - description: asc | desc
        in: query
        name: sort_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SolutionResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: List solutions
      tags:
      - Solution Catalog
    post:
      consumes:
      - application/json
      parameters:
      - description: Solution
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSolutionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.SolutionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create solution
      tags:
      - Solution Catalog
  /api/v1/solutions/{solutionId}:
    get:
      parameters:
      - description: Solution ID
        in: path
        name: solutionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.SolutionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get solution
      tags:
      - Solution Catalog
  /api/v1/solutions/{solutionId}/clients:
    post:
      consumes:
      - application/json
      description: client_secret hanya ditampilkan sekali di respons ini.
      parameters:
      - description: Solution ID
        in: path
        name: solutionId
        required: true
        type: string
      - description: Client
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSolutionClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.SolutionClientWithSecretResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create solution client
      tags:
      - Solution Clients
  /api/v1/tenants:
    get:
      description: Platform admin melihat semua tenant; user lain hanya tenant tempat
        ia member active.
      parameters:
      - description: active | suspended | closed
        in: query
        name: status
        type: string
      - description: Cari di name / slug
        in: query
        name: search
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (maks 100)
        in: query
        name: limit
        type: integer
      - description: name | slug | created_at
        in: query
        name: sort_by
        type: string
      - description: asc | desc
        in: query
        name: sort_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TenantResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: List tenants
      tags:
      - Tenants
    post:
      consumes:
      - application/json
      description: Pembuat (non platform admin) otomatis menjadi member active.
      parameters:
      - description: Tenant
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.TenantResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create tenant
      tags:
      - Tenants
  /api/v1/tenants/{tenantId}:
    get:
      description: Platform admin, atau member active yang token-nya ber-tid tenant
        ini.
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.TenantResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get tenant
      tags:
      - Tenants
  /api/v1/tenants/{tenantId}/members:
    get:
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: invited | active | inactive
        in: query
        name: status
        type: string
      - description: Cari di email / nama user
        in: query
        name: search
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (maks 100)
        in: query
        name: limit
        type: integer
      - description: email | name | joined_at
        in: query
        name: sort_by
        type: string
      - description: asc | desc
        in: query
        name: sort_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TenantMemberResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.Meta'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: List tenant members
      tags:
      - Tenants
    post:
      consumes:
      - application/json
      description: Isi salah satu user_id atau email (user harus sudah terdaftar).
        Member inactive diaktifkan kembali.
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Member
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddTenantMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.TenantMemberResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Add tenant member
      tags:
      - Tenants
  /api/v1/users:
    post:
      consumes:
      - application/json
      parameters:
      - description: User
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.SuccessBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Users
  /healthz:
    get:
      produces:
      - application/json
      responses:
