version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - platform-service
