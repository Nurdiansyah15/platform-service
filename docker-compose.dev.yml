name: platform-service

# Env bersama untuk semua service app (app, worker, migrate, seeder).
# DB_HOST diarahkan ke nama service postgres; nilai dari .env di-host (bila ada)
# tetap dibaca godotenv di dalam container untuk var di luar daftar ini.
x-app-env: &app-env
  APP_ENV: development
  APP_PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: "${DB_USER:-platform}"
  DB_PASS: "${DB_PASS:-secret}"
  DB_NAME: "${DB_NAME:-platform}"
  DB_SSLMODE: "${DB_SSLMODE:-disable}"
  ISSUER_URL: "${ISSUER_URL:-http://localhost:8080}"
  ALLOW_PRIVATE_HTTP_APP_URLS: "${ALLOW_PRIVATE_HTTP_APP_URLS:-false}"
  LOCALES_DIR: locales
  # Keys JWT disimpan di volume agar konsisten dengan postgres yang persisten.
  KEYSTORE_DIR: /keystore
  PLATFORM_ADMIN_EMAIL: "${PLATFORM_ADMIN_EMAIL:-admin@platform.local}"
  PLATFORM_ADMIN_NAME: "${PLATFORM_ADMIN_NAME:-Platform Admin}"
  PLATFORM_ADMIN_PASSWORD: "${PLATFORM_ADMIN_PASSWORD:-ChangeMe123!}"
  CONSOLE_SOLUTION_CODE: "${CONSOLE_SOLUTION_CODE:-platform-console}"
  CONSOLE_SOLUTION_NAME: "${CONSOLE_SOLUTION_NAME:-Platform Console}"

# Env runtime container web (bun). Konfigurasi Nuxt diambil dari .env root
# (bagian "Web UI").
x-web-env: &web-env
  HOME: /tmp
  CI: "true"
  # Cache bun di /tmp container agar tidak tercipta folder cache di web/.
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
  NUXT_PUBLIC_API_BASE: "${NUXT_PUBLIC_API_BASE:-http://localhost:8080}"
  NUXT_PUBLIC_DEFAULT_SOLUTION: "${NUXT_PUBLIC_DEFAULT_SOLUTION:-platform-console}"
  NUXT_PUBLIC_ALLOW_PRIVATE_HTTP_APP_URLS: "${NUXT_PUBLIC_ALLOW_PRIVATE_HTTP_APP_URLS:-false}"
  NUXT_WATCH_POLLING: "${NUXT_WATCH_POLLING:-false}"

# Basis service Go dev: image sama, source di-bind-mount (tanpa volume kode).
x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: platform-service/dev
  working_dir: /app
  volumes:
    - .:/app
    - keystore_data:/keystore
  environment: *app-env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-service_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-platform}"
      POSTGRES_PASSWORD: "${DB_PASS:-secret}"
      POSTGRES_DB: "${DB_NAME:-platform}"
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-platform} -d ${DB_NAME:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Satu kali jalan saat `up`; app & worker menunggu migrasi selesai.
  migrate:
    <<: *dev
    restart: "no"
    entrypoint: ["go", "run", "./cmd/migrate"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # On-demand: `docker compose --profile tools run --rm seeder [name...]`
  seeder:
    <<: *dev
    restart: "no"
    profiles: ["tools"]
    entrypoint: ["go", "run", "./cmd/seeder"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *dev
    command: ["go", "run", "./cmd/app"]
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *dev
    command: ["go", "run", "./cmd/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # UI Nuxt (SPA). Source di-bind-mount; node_modules dibuat di host agar
  # ownership cocok (container dijalankan sebagai UID host).
  web:
    image: oven/bun:1.3.12-slim
    container_name: platform-service_web
    working_dir: /app
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment: *web-env
    volumes:
      - ./web:/app
    command: ["sh", "-c", "test -x node_modules/.bin/nuxt || (echo 'node_modules belum ada. Jalankan: make web-install'; exit 1); exec bun --bun nuxt dev --host 0.0.0.0"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
  keystore_data:
